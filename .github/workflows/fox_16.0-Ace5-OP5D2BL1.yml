#
# OrangeFox fox_16.0 (Android 16) for the OnePlus Ace 5 (PKG110 / OP5D2BL1 / giulia)
#
# Same idea as the parameterised builders in this repository: choose the source
# branch and a device tree, let the runner do the rest, download the image from
# the release.  Things worth knowing about this one:
#
#   * the source tree comes from OrangeFox's own sync script
#     (`orangefox_sync.sh --branch 16.0`), which for fox_16.0 initialises the
#     complete OrangeFox manifest with no local patching;
#   * gitlab.com is the only external dependency, so every clone/init/sync is
#     retried, and the host setup script falls back to a copy pinned in this
#     repository (one transient 503 used to kill a 1.5 h run);
#   * source, out/ and swap are placed on the largest free mount;
#   * after the build the image is unpacked and checked (boot header v4, 483
#     kernel modules, the vibration HAL and its /odm data, parity with the
#     device tree) and ldcheck runs over the security/vibration binaries;
#   * job logs need authentication to read, so a build report is force-pushed
#     to the `ci-logs` branch on every run, success or failure.
#
name: OrangeFox fox_16.0 - OnePlus Ace 5 (OP5D2BL1)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch'
        required: true
        default: '16.0'
        type: choice
        options:
          - '16.0'
      DEVICE_TREE:
        description: 'Device tree repository URL'
        required: true
        default: 'https://github.com/XiaoChen515144/OnePlus-Ace5'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch, tag or commit'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Where to drop the device tree'
        required: true
        default: 'device/oneplus/OP5D2BL1'
      DEVICE_NAME:
        description: 'Device codename / product name'
        required: true
        default: 'OP5D2BL1'
      LUNCH_TARGET:
        description: 'lunch target'
        required: true
        default: 'twrp_OP5D2BL1-bp2a-eng'
      BUILD_TARGET:
        description: 'make goals'
        required: true
        default: 'adbd recoveryimage'
      FOX_BUILD_TYPE:
        description: 'FOX_BUILD_TYPE baked into the image'
        required: false
        default: 'Alpha'
      LDCHECK:
        description: 'Binaries for the dynamic-link consistency check'
        required: false
        default: 'vendor/bin/qseecomd vendor/bin/hw/vendor.oplus.hardware.vibrator-service vendor/bin/hw/android.hardware.security.keymint-service-qti vendor/bin/hw/android.hardware.weaver-service.nxp vendor/bin/hw/android.hardware.secure_element-service.qti'
      RECOVERY_INSTALLER:
        description: 'Also publish a recovery-installer.zip'
        required: false
        default: false
        type: boolean
      PUBLISH_RELEASE:
        description: 'Publish a GitHub release with the image'
        required: false
        default: true
        type: boolean

  # Editing this file starts a build, so the workflow can be maintained from
  # the command line. Pushes made with GITHUB_TOKEN cannot trigger it, which
  # keeps the ci-logs report below from looping.
  push:
    paths:
      - '.github/workflows/fox_16.0-Ace5-OP5D2BL1.yml'

# A newer run makes an older one pointless.
concurrency:
  group: fox16-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || '16.0' }}
  DEVICE_TREE: ${{ github.event.inputs.DEVICE_TREE || 'https://github.com/XiaoChen515144/OnePlus-Ace5' }}
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH || 'main' }}
  DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/oneplus/OP5D2BL1' }}
  DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'OP5D2BL1' }}
  LUNCH_TARGET: ${{ github.event.inputs.LUNCH_TARGET || 'twrp_OP5D2BL1-bp2a-eng' }}
  BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'adbd recoveryimage' }}
  FOX_BUILD_TYPE: ${{ github.event.inputs.FOX_BUILD_TYPE || 'Alpha' }}
  LDCHECK: ${{ github.event.inputs.LDCHECK || 'vendor/bin/qseecomd vendor/bin/hw/vendor.oplus.hardware.vibrator-service vendor/bin/hw/android.hardware.security.keymint-service-qti vendor/bin/hw/android.hardware.weaver-service.nxp vendor/bin/hw/android.hardware.secure_element-service.qti' }}

jobs:
  build:
    name: Build OrangeFox ${{ github.event.inputs.MANIFEST_BRANCH || '16.0' }} for OP5D2BL1
    runs-on: ubuntu-22.04
    # GitHub-hosted jobs are killed after 6 h; a cold build needs ~1.5-2 h.
    timeout-minutes: 350

    steps:
      - name: Checkout this builder
        uses: actions/checkout@v7
        with:
          path: self

      - name: Prepare runner (disk space, swap, work paths)
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1

          # Preinstalled toolchains this build never uses. Removing them
          # reclaims ~25-30 GB on the (small) root disk.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/local/lib/node_modules \
            /usr/local/rustup \
            /usr/local/cargo
          # Extra reclaim if available: docker layers, snapd, azure/chrome.
          sudo docker image prune -af >/dev/null 2>&1 || true
          for pkg in snapd azure-cli google-chrome-stable powershell mono-runtime; do
            sudo apt-get -y purge --auto-remove "$pkg" >/dev/null 2>&1 || true
          done
          sudo apt-get clean
          echo "--- free space after cleanup ---"
          df -h
          lsblk -f
          free -h

          # Everything (source, out/, swap) goes on the largest mount. On a
          # standard runner that is /; some images have a bigger /mnt. Both
          # are root-owned, so create the tree with sudo and hand it over.
          WORK_ROOT="$(df -Pk /mnt / 2>/dev/null \
            | awk 'NR > 1 && $6 != "" {print $4, $6}' \
            | sort -rn | head -1 | awk '{print $2}')" || WORK_ROOT=""
          WORK_ROOT="${WORK_ROOT:-/}"
          WORK="${WORK_ROOT%/}/fox-work"
          sudo mkdir -p "$WORK"
          sudo chown -R "$(id -u):$(id -g)" "$WORK"
          SRC="$WORK/fox_$MANIFEST_BRANCH"
          OUT_DIR="$WORK/out"
          mkdir -p "$SRC" "$OUT_DIR" "$GITHUB_WORKSPACE/self/artifacts" "$GITHUB_WORKSPACE/self/dist"
          {
            echo "WORK_ROOT=$WORK_ROOT"
            echo "WORK=$WORK"
            echo "SRC=$SRC"
            echo "OUT_DIR=$OUT_DIR"
            echo "PRODUCT_OUT=$OUT_DIR/target/product/$DEVICE_NAME"
          } >> "$GITHUB_ENV"
          echo "work root: $WORK_ROOT  source: $SRC"

          # Swap keeps the linker from being OOM-killed. Size it adaptively
          # (max 8 GB, at most a third of the free space) so the swapfile
          # cannot eat the disk the source tree is about to need.
          SWAP="$WORK/swapfile"
          if [ ! -f "$SWAP" ]; then
            FREE_MB=$(( $(df -Pk "$WORK" | awk 'NR == 2 {print $4}') / 1024 ))
            SWAP_MB=$(( FREE_MB / 3 ))
            if [ "$SWAP_MB" -gt 8192 ]; then SWAP_MB=8192; fi
            if [ "$SWAP_MB" -lt 2048 ]; then SWAP_MB=2048; fi
            echo "creating a ${SWAP_MB} MB swap file (${FREE_MB} MB free)"
            sudo fallocate -l "${SWAP_MB}M" "$SWAP" \
              || sudo dd if=/dev/zero of="$SWAP" bs=1M count="$SWAP_MB" status=none
            sudo chmod 600 "$SWAP"
            sudo mkswap "$SWAP" >/dev/null
          fi
          sudo swapon "$SWAP" 2>/dev/null || true
          free -h

      - name: Build environment
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          git config --global --add safe.directory '*'
          git config --global user.name 'OrangeFox CI'
          git config --global user.email 'ci@localhost'
          git config --global color.ui false
          RETRY=(--retry 10 --retry-delay 6 --retry-all-errors --retry-connrefused)

          # OrangeFox's host setup script, with a pinned fallback: gitlab.com
          # does return transient 503s, and one of those used to cost a whole
          # run before the source tree was even created.
          ENV_SCRIPT=/tmp/android_build_env.sh
          if [ -f "$GITHUB_WORKSPACE/self/.github/scripts/android_build_env.sh" ]; then
            cp "$GITHUB_WORKSPACE/self/.github/scripts/android_build_env.sh" "$ENV_SCRIPT"
          else
            curl -fsSL "${RETRY[@]}" \
              https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh \
              -o "$ENV_SCRIPT"
          fi
          sudo bash "$ENV_SCRIPT"

          # The setup script installs `repo` without the exec bit and without
          # -f, so a 503 there leaves an unusable file behind. Verify it.
          [ -x /usr/local/bin/repo ] || sudo chmod a+x /usr/local/bin/repo
          if ! repo --version >/dev/null 2>&1; then
            echo "repo launcher unusable, fetching it directly"
            sudo curl -fsSL "${RETRY[@]}" \
              -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
            sudo chmod a+rx /usr/local/bin/repo
          fi
          hash -r
          python3 --version
          repo --version
          gh --version | head -1

      - name: Sync OrangeFox sources (fox_${{ env.MANIFEST_BRANCH }})
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          RETRY=(--retry 10 --retry-delay 6 --retry-all-errors --retry-connrefused)

          # Start from a clean manifest directory: repo init/sync populate it
          # and a retry of this step must not reuse a half-synced tree.
          rm -rf "$SRC"
          mkdir -p "$SRC"

          cd "$WORK"
          rm -rf "$WORK/sync"
          for attempt in 1 2 3 4 5; do
            if git clone --depth=1 "${RETRY[@]}" \
                 https://gitlab.com/OrangeFox/sync.git "$WORK/sync"; then
              break
            fi
            echo "cloning the sync script failed (attempt ${attempt}/5)"
            rm -rf "$WORK/sync"
            sleep $((attempt * 15))
          done

          cd "$WORK/sync"
          sync_ok=0
          for attempt in 1 2 3; do
            if ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$SRC"; then
              sync_ok=1
              break
            fi
            echo "sync failed (attempt ${attempt}/3); starting from a clean tree"
            rm -rf "$SRC"
            mkdir -p "$SRC"
            sleep 30
          done
          [ "$sync_ok" = 1 ] || { echo "::error::could not sync the OrangeFox tree"; exit 1; }

          echo "--- synced tree ---"
          du -sh "$SRC"
          df -h "$WORK_ROOT"
          [ -d "$SRC/vendor/twrp" ] || echo "::warning::vendor/twrp is missing from the synced tree"

      - name: Clone device tree
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          RETRY=(--retry 10 --retry-delay 6 --retry-all-errors --retry-connrefused)
          DEST="$SRC/$DEVICE_PATH"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cd "$DEST"
          git init -q .
          git remote add origin "$DEVICE_TREE"
          for attempt in 1 2 3 4 5; do
            if git fetch --depth=1 "${RETRY[@]}" origin "$DEVICE_TREE_BRANCH" \
               && git checkout -q FETCH_HEAD; then
              break
            fi
            echo "fetching the device tree failed (attempt ${attempt}/5)"
            sleep $((attempt * 15))
          done
          DEVICE_COMMIT="$(git rev-parse HEAD)"
          echo "device tree: $DEVICE_TREE @ $DEVICE_COMMIT"
          echo "DEVICE_COMMIT=$DEVICE_COMMIT" >> "$GITHUB_ENV"
          echo "DEVICE_TREE_URL=${DEVICE_TREE%.git}" >> "$GITHUB_ENV"
          ls -l | head -25
          test -f "twrp_$DEVICE_NAME.mk" || echo "::warning::twrp_$DEVICE_NAME.mk is missing"
          df -h "$WORK_ROOT" | tail -1

      - name: Build ${{ env.BUILD_TARGET }}
        id: build
        run: |
          set -eo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          cd "$SRC"
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export FOX_BUILD_TYPE="$FOX_BUILD_TYPE"
          export OUT_DIR

          source build/envsetup.sh
          lunch "$LUNCH_TARGET"

          # Keep going after a failure so diagnostics can still be collected.
          set +e
          mka $BUILD_TARGET 2>&1 | tee "$GITHUB_WORKSPACE/self/build.log"
          RC=${PIPESTATUS[0]}
          set -e

          mkdir -p "$GITHUB_WORKSPACE/self/build-logs"
          for f in error.log verbose.log.gz; do
            [ -f "$OUT_DIR/$f" ] && cp -f "$OUT_DIR/$f" "$GITHUB_WORKSPACE/self/build-logs/"
          done

          if [ "$RC" -ne 0 ]; then
            echo "::error::build failed (rc=$RC); see the log tail and the build-logs artifact"
            tail -n 100 "$GITHUB_WORKSPACE/self/build.log" || true
          fi
          exit "$RC"

      - name: Check the built image
        id: check
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          IMG="$PRODUCT_OUT/recovery.img"
          OF_IMG="$(ls "$PRODUCT_OUT"/OrangeFox*.img 2>/dev/null | head -1)"
          IMAGE="${OF_IMG:-$IMG}"
          test -s "$IMAGE" || { echo "::error::no image produced in $PRODUCT_OUT"; exit 1; }

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
          ls -l "$PRODUCT_OUT" | head -30

          # Unpack the image and verify its contents (boot header, module list,
          # vibration HAL data, parity with the device tree).
          EXPECT_RAW="$(grep -E '^BOARD_RECOVERYIMAGE_PARTITION_SIZE' "$SRC/$DEVICE_PATH/BoardConfig.mk" \
            | head -1 | sed 's/.*:=[[:space:]]*//' | tr -d ' ')" || true
          EXPECT=$(( ${EXPECT_RAW:-0} ))
          set +e
          python3 "$GITHUB_WORKSPACE/self/tools/unpack_recovery.py" "$IMAGE" \
            --device-root "$SRC/$DEVICE_PATH" \
            --content-check \
            --json "$GITHUB_WORKSPACE/self/selfcheck.json" \
            --dump-cpio "$RUNNER_TEMP/ramdisk.cpio" \
            ${EXPECT:+--expect-size "$EXPECT"} 2>&1 | tee "$GITHUB_WORKSPACE/self/verify.log"
          echo "::notice::image self-check exit=$?"
          set -e

          # Dynamic-link consistency check over the security/vibration binaries.
          LD_ROOT="$PRODUCT_OUT/recovery/root"
          if [ -d "$LD_ROOT" ]; then
            cp -n "$GITHUB_WORKSPACE/self/tools/ldcheck" "$LD_ROOT/" || true
            cp -n "$GITHUB_WORKSPACE/self/tools/libneeds" "$LD_ROOT/" || true
            : > "$GITHUB_WORKSPACE/self/ldcheck.log"
            for f in $LDCHECK; do
              echo "### ldcheck $f" | tee -a "$GITHUB_WORKSPACE/self/ldcheck.log"
              ( cd "$LD_ROOT" && python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib \
                  -d "$f" 2>&1 | tail -n 40 ) | tee -a "$GITHUB_WORKSPACE/self/ldcheck.log" || true
            done
          fi
          df -h "$WORK_ROOT" | tail -1

      - name: Stage the deliverables
        if: env.CHECK_IMG_IS_OK == 'true'
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          cd "$GITHUB_WORKSPACE/self/artifacts"
          cp -f "$IMAGE" recovery.img
          sha256sum recovery.img > recovery.img.sha256
          md5sum recovery.img > recovery.img.md5
          cat recovery.img.sha256 recovery.img.md5

          # Everything else the release carries: OrangeFox's own image name,
          # the installer zip and the checksum files.
          cd "$GITHUB_WORKSPACE/self/dist"
          cp -f "$PRODUCT_OUT"/OrangeFox*.img . 2>/dev/null || true
          cp -f "$PRODUCT_OUT"/OrangeFox*.zip . 2>/dev/null || true
          cp -f "$PRODUCT_OUT"/OrangeFox*.img.md5 . 2>/dev/null || true
          cp -f "$PRODUCT_OUT"/OrangeFox*.zip.md5 . 2>/dev/null || true
          cp -f "$PRODUCT_OUT"/ramdisk-recovery.img . 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/self/artifacts/recovery.img."{sha256,md5} . 2>/dev/null || true
          ls -l

          SIZE="$(stat -c %s recovery.img 2>/dev/null || stat -c %s "$IMAGE")"
          {
            echo "### OrangeFox fox_$MANIFEST_BRANCH - OnePlus Ace 5 ($DEVICE_NAME)"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| device tree | \`$DEVICE_TREE_URL@$DEVICE_COMMIT\` |"
            echo "| lunch | \`$LUNCH_TARGET\` |"
            echo "| targets | \`$BUILD_TARGET\` |"
            echo "| image | \`$(basename "$IMAGE")\` |"
            echo "| size | $SIZE bytes ($(numfmt --to=iec "$SIZE")) |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$GITHUB_WORKSPACE/self/artifacts/recovery.img.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image artifact
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ env.DEVICE_NAME }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: self/artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            self/build.log
            self/build-logs
            self/ci.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release
        if: >-
          success()
          && env.CHECK_IMG_IS_OK == 'true'
          && github.event.inputs.PUBLISH_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/self/ci.log") 2>&1
          TAG="fox16-${DEVICE_COMMIT:0:12}"
          [ -n "${DEVICE_COMMIT:-}" ] || TAG="fox16-run$GITHUB_RUN_NUMBER"
          echo "publishing release $TAG"

          # Optional recovery-installer.zip (third-party helper, off by default).
          if [ "${{ github.event.inputs.RECOVERY_INSTALLER }}" = "true" ]; then
            cd "$GITHUB_WORKSPACE/self/dist"
            curl -fsSL --retry 5 -o recovery-installer.zip \
              https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip \
              || echo "::warning::could not fetch recovery-installer.zip"
            if [ -f recovery-installer.zip ]; then
              cp -f "$GITHUB_WORKSPACE/self/artifacts/recovery.img" ./recovery.img
              zip -ur recovery-installer.zip recovery.img || true
            fi
          fi

          # A run number suffix keeps repeated builds of one commit from
          # clashing; the tag itself stays reproducible.
          URL="https://github.com/${GITHUB_REPOSITORY}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OrangeFox fox_$MANIFEST_BRANCH - OnePlus Ace 5 ($DEVICE_NAME) - run #$GITHUB_RUN_NUMBER" \
            --notes "$(printf '%s\n' \
              "Automatic OrangeFox \`fox_$MANIFEST_BRANCH\` build for the **OnePlus Ace 5** (PKG110 / $DEVICE_NAME / giulia)." \
              "" \
              "* device tree: ${DEVICE_TREE_URL} @ \`${DEVICE_COMMIT}\`" \
              "* lunch: \`$LUNCH_TARGET\`" \
              "* targets: \`$BUILD_TARGET\`" \
              "* build type: \`$FOX_BUILD_TYPE\`" \
              "* workflow run: $URL/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "\`recovery.img\` is ramdisk-only (the kernel comes from the stock \`boot\`" \
              "partition), so flash it with:" \
              "" \
              '```' \
              "fastboot flash recovery_a recovery.img" \
              "fastboot flash recovery_b recovery.img" \
              '```' \
              "" \
              "Verify the attached \`recovery.img.sha256\` before flashing.")" \
            $GITHUB_WORKSPACE/self/artifacts/recovery.img \
            $GITHUB_WORKSPACE/self/artifacts/recovery.img.sha256 \
            $GITHUB_WORKSPACE/self/artifacts/recovery.img.md5 \
            $GITHUB_WORKSPACE/self/dist/OrangeFox*.img \
            $GITHUB_WORKSPACE/self/dist/OrangeFox*.zip \
            $GITHUB_WORKSPACE/self/dist/OrangeFox*.md5 \
            $GITHUB_WORKSPACE/self/dist/recovery-installer.zip \
            $GITHUB_WORKSPACE/self/dist/ramdisk-recovery.img \
            --clobber || echo "::warning::could not create the release"

      - name: Publish build report to the ci-logs branch
        # Runs whatever happened and force-pushes a report (image info, the
        # checks, the log lines that matter for this device, the AOSP error log
        # and the log tail) to the `ci-logs` branch, so a build can be inspected
        # with a plain `git fetch` - no token, no web UI. Pushes made with
        # GITHUB_TOKEN do not trigger workflows, so this cannot loop.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -uo pipefail
          REPORT_DIR="$RUNNER_TEMP/report"
          mkdir -p "$REPORT_DIR"

          {
            echo "# OrangeFox fox_$MANIFEST_BRANCH build report - OnePlus Ace 5 ($DEVICE_NAME)"
            echo
            echo "- run: #$GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT) -> **$JOB_RESULT**"
            echo "- event: \`$GITHUB_EVENT_NAME\` on \`$GITHUB_REF\`"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- device tree: \`${DEVICE_TREE_URL:-?}@${DEVICE_COMMIT:-?}\`"
            echo "- lunch: \`$LUNCH_TARGET\` | targets: \`$BUILD_TARGET\` | type: \`$FOX_BUILD_TYPE\`"
            echo "- runner: $(nproc) vCPU, $(awk '/MemTotal/{printf "%d", $2/1024/1024}' /proc/meminfo) GiB RAM"
            echo
            echo "## image"
            if [ -n "${PRODUCT_OUT:-}" ] && [ -s "$PRODUCT_OUT/recovery.img" ]; then
              ls -l "$PRODUCT_OUT"/recovery.img "$PRODUCT_OUT"/OrangeFox*.img 2>/dev/null
              sha256sum "$PRODUCT_OUT/recovery.img"
            else
              echo "no recovery.img at \`${PRODUCT_OUT:-unknown}\`"
            fi
            echo
            echo "## image self-check"
            cat "$GITHUB_WORKSPACE/self/selfcheck.json" 2>/dev/null || echo "(not run)"
            echo
            echo "## image self-check output"
            tail -n 60 "$GITHUB_WORKSPACE/self/verify.log" 2>/dev/null || echo "(not run)"
            echo
            echo "## ldcheck (missing dynamic dependencies)"
            grep -vE '^\s*$' "$GITHUB_WORKSPACE/self/ldcheck.log" 2>/dev/null | tail -n 60 || echo "(not run)"
            echo
            echo "## product output"
            ls -l "${PRODUCT_OUT:-/nonexistent}" 2>/dev/null | head -30 || echo "(missing)"
            echo
            echo "## kernel module loading"
            grep -nE 'Modules Loaded|Loaded [0-9]+ modules|Loading (post-decrypt )?module|Post-decrypt|module (loaded|failed)|Failed to load' \
              "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null | tail -n 60 || echo "(no matches)"
            echo
            echo "## haptics / vibrator"
            grep -niE 'awinic|haptic|vibrator|oplus.vibrator' "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null | tail -n 40 || echo "(no matches)"
            echo
            echo "## ninja progress when it stopped"
            grep -oE '\[ *[0-9]+% [0-9]+/[0-9]+\]' "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null | tail -1 || echo "(n/a)"
            echo "failed targets: $(grep -c '^FAILED:' "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null || echo 0)"
            echo
            echo "## build errors"
            grep -nE 'ninja: build stopped|^FAILED|error:|ERROR:|undefined reference|missing dependencies' \
              "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null | tail -n 60 || echo "(no matches)"
            echo
            echo "## out/error.log"
            tail -n 80 "$GITHUB_WORKSPACE/self/build-logs/error.log" 2>/dev/null || echo "(none)"
            echo
            echo "## errors found in the combined step log"
            grep -nE 'error|fatal|failed|Failed|No space|Cannot|Permission denied|not found' \
              "$GITHUB_WORKSPACE/self/ci.log" 2>/dev/null | tail -n 40 || echo "(no matches)"
            echo
            echo "## disk / memory at the end of the job"
            df -h 2>/dev/null
            free -h 2>/dev/null
            du -sh "${SRC:-/nonexistent}" "${OUT_DIR:-/nonexistent}" 2>/dev/null || true
            echo
            echo "## last 500 build log lines"
            tail -n 500 "$GITHUB_WORKSPACE/self/build.log" 2>/dev/null || echo "(no build.log)"
            echo
            echo "## last 300 lines of the combined step log"
            tail -n 300 "$GITHUB_WORKSPACE/self/ci.log" 2>/dev/null || echo "(no ci.log)"
          } > "$REPORT_DIR/report.md" 2>&1

          cd "$REPORT_DIR"
          git init -q .
          git checkout -q -b ci-logs
          git -c user.name='OrangeFox CI' -c user.email='ci@localhost' add -A
          git -c user.name='OrangeFox CI' -c user.email='ci@localhost' commit -q -m "CI report: run #$GITHUB_RUN_NUMBER ($JOB_RESULT)" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs \
            || echo "::warning::could not push the build report to the ci-logs branch"
          echo "build report: $(wc -l < "$REPORT_DIR/report.md") lines on the ci-logs branch"
          tail -n 25 "$REPORT_DIR/report.md"
